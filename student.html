<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Registration Form</title>
  

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#f4f7fc;
      padding:40px;
    }

    .container{
      max-width:900px;
      margin:auto;
    }

    .form-box{
      background:#fff;
      padding:30px;
      border-radius:10px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      margin-bottom:40px;
    }

    h2{
      text-align:center;
      margin-bottom:25px;
      color:#333;
    }

    .form-group{
      margin-bottom:18px;
    }

    label{
      display:block;
      margin-bottom:6px;
      font-weight:bold;
      color:#444;
    }

    input,
    select,
    textarea{
      width:100%;
      padding:10px;
      border:1px solid #ccc;
      border-radius:5px;
      font-size:15px;
    }

    textarea{
      resize:none;
      height:80px;
    }

    .gender{
      display:flex;
      gap:20px;
      margin-top:8px;
    }

    .gender label{
      font-weight:normal;
    }

    button{
      width:100%;
      padding:12px;
      background:#007bff;
      color:white;
      border:none;
      border-radius:5px;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#0056b3;
    }

    .table-box{
      background:#fff;
      padding:30px;
      border-radius:10px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
    }

    table th,
    table td{
      border:1px solid #ccc;
      padding:12px;
      text-align:center;
    }

    table th{
      background:#007bff;
      color:white;
    }

    table tr:hover{
      background:#f1f1f1;
    }

    @media(max-width:768px){
      body{
        padding:15px;
      }

      .gender{
        flex-direction:column;
        gap:10px;
      }

      table{
        font-size:14px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Registration Form -->
    <div class="form-box">
      <h2 style="color:blue;">Student Registration Form</h2>

      <form>

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="Enter password" required>
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" placeholder="Enter phone number" required>
        </div>

        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" required>
        </div>

        <div class="form-group">
          <label>Select Course</label>
          <select required>
            <option value="">-- Select Course --</option>
            <option>HTML</option>
            <option>CSS</option>
            <option>JavaScript</option>
            <option>React</option>
          </select>
        </div>

        <div class="form-group">
          <label>Gender</label>

          <div class="gender">
            <label>
              <input type="radio" name="gender"> Male
            </label>

            <label>
              <input type="radio" name="gender"> Female
            </label>
          </div>
        </div>

        <div class="form-group">
          <label>Address</label>
          <textarea placeholder="Enter address"></textarea>
        </div>

        <button type="submit">Register</button>

      </form>
    </div>

    <!-- Student Table -->
    <div class="table-box">
      <h2>Student Data Table</h2>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Course</th>
            <th>City</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td>1</td>
            <td>Rahul</td>
            <td>HTML</td>
            <td>Mumbai</td>
          </tr>

          <tr>
            <td>2</td>
            <td>Sneha</td>
            <td>CSS</td>
            <td>Pune</td>
          </tr>

          <tr>
            <td>3</td>
            <td>Amit</td>
            <td>JavaScript</td>
            <td>Nashik</td>
          </tr>

          <tr>
            <td>4</td>
            <td>Priya</td>
            <td>React</td>
            <td>Nagpur</td>
          </tr>
        </tbody>

      </table>
    </div>

  </div>

</body>
</html>
